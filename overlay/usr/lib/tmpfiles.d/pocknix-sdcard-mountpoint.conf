# pocknix: punto de montaje del automontaje de tarjetas (hwsupport/sdcard-mount.sh).
# /run es tmpfs: sin esta entrada, /run/media/deck desaparece en cada arranque y
#   - la share [sdcard] de Samba falla: "canonicalize_connect_path failed for service sdcard"
#   - el automontaje no tiene donde montar las tarjetas.
# (Visto en la Odin el 15/10/2026.)
d /run/media/deck 0755 deck deck -
