# pocknix: directorio base de msm-firmware-loader.
# El script del loader (msm-firmware-loader.sh) monta un tmpfs encima, pero NO lo crea el mismo:
# si /run/msm-firmware-loader no existe falla con "mount point does not exist" y se queda sin
# montar ninguna particion del firmware (el arbol HexagonFS de los sensores sale vacio).
# /run es tmpfs, asi que hay que recrearlo en cada arranque.
# (Visto en la Odin el 15/10/2026.)
d /run/msm-firmware-loader 0755 root root -
