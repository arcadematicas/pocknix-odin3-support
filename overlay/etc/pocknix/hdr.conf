# HDR de la sesion de juegos (gamescope) — estilo ArmadaOS.
#
# Armada lo hace por dispositivo: un valor NITS distinto de cero en el device conf
# hace que la sesion exporte el device id del panel y el perfil Lua (10-armada/…) aporte
# colorimetria + capacidades; y "Steam owns runtime HDR state", o sea que NADIE fuerza
# el estado HDR. Aqui no tenemos el ajuste en el cliente Steam (es ARM64), asi que el
# papel de "ajustes de Steam" lo hace pocknix-control.
#
# NITS del panel (650 = lo anuncia; 0 = no se anuncia y el HDR no aparece):
POCKNIX_HDR_NITS=650
# Estado HDR al arrancar la sesion: off | on   (se guarda tu eleccion del QAM)
# off por defecto: con HDR global el QAM y mangoapp caian DETRAS del juego.
POCKNIX_HDR_DEFAULT=off
