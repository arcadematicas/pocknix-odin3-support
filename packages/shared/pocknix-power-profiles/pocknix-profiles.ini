# pocknix: power-profiles-daemon profile set for the AYN Odin 3 (SM8750).
#
# Mainline exposes no ACPI platform_profile on this SoC, so ppd falls back to its
# "placeholder" driver, which only advertises power-saver + balanced. The Odin does
# have three real levels (pocknix-power-profile bajo|medio|alto), so we ship this ini
# and point ppd at it through POWER_PROFILE_DAEMON_FAKE_DRIVER (see
# /etc/systemd/system/power-profiles-daemon.service.d/50-pocknix-profiles.conf):
# the D-Bus API then offers all three canonical profiles, so powerprofilesctl and the
# Plasma "Battery and Brightness" applet can select them. ppd itself does nothing to
# the hardware with this backend: the real CPU/GPU caps are applied by our bridge,
# /usr/local/bin/pocknix-power-profiles, through /usr/local/bin/pocknix-power-profile.
[Driver]
Profiles=power-saver;balanced;performance
