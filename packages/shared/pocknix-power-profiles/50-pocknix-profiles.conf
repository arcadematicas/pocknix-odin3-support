[Service]
# pocknix: the Odin has no ACPI platform_profile, so ppd's placeholder backend would
# only expose power-saver + balanced. Load ppd's upstream "fake" backend with our
# three-profile ini instead; the real work is done by pocknix-power-profiles.
Environment=POWER_PROFILE_DAEMON_FAKE_DRIVER=/etc/power-profiles-daemon/pocknix-profiles.ini
