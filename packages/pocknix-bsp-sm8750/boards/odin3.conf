# /usr/lib/pocknix/boards/odin3.conf — runtime board facts: AYN Odin 3 (SM8750).
# Selected by /usr/lib/pocknix/device.conf (DT model "AYN Odin 3").
#
# PROVENANCE: the panel facts come from the device itself (session log / kscreen-doctor) and
# from the DTS; the CPU topology comes from pocknix-power-profile's cluster notes. Anything not
# verified on hardware is marked TODO below — do NOT guess a value into place.

POCKNIX_DEVICE=odin3
POCKNIX_SOC=sm8750

# Panel: chipone,icna3520 (AMOLED) — native 1080x1920 portrait, DTS rotation=90.
# VERIFIED on device: `kscreen-doctor -o` reports
#   DSI-1 1080x1920@120 scale 2.5 Rotation 8 (Rotate270) Panel
POCKNIX_PANEL_W=1080
POCKNIX_PANEL_H=1920
POCKNIX_PANEL_REFRESH=120
# gamescope --force-orientation. `left` is also pocknix-steam's fallback default and is what the
# device has been running with; the DTS rotation=90 is the same value the sm8550 Odin 2 uses.
# TODO: confirm on device (an upside-down picture means this should be `right`).
POCKNIX_PANEL_ORIENT=left
# gamescope GAMESCOPE_FAKE_OUTPUT_MM: the physical size gamescope uses to size the UI. The sm8550
# family deliberately uses 177x100 so every 1920x1080-class device lands on the same ~275dpi UI;
# the Odin 3 has been running with that same value.
POCKNIX_PANEL_MM=177x100
# kscreen-doctor rotation token for the Plasma session (Rotate270 -> left).
POCKNIX_DESKTOP_ROTATE=left
POCKNIX_DESKTOP_SCALE=2.5

# CPU topology: SM8750 = 8 cores, prime cluster is cpu6-7 (see pocknix-power-profile, which caps
# cpu6-7 for the "medio" profile). Used as the big-core mask for emulator pinning.
POCKNIX_BIG_CORES=6-7

# --- install-to-internal contract (qcom-abl) -----------------------------------
# TODO: unverified for the Odin 3 — the sm8550 family uses /dev/sda with a POCKNIX-labelled boot
# partition. Leaving these out (rather than guessing) means the "install to internal" Tools path
# must NOT be used on this device until they are confirmed against a real Odin 3.
# POCKNIX_INTERNAL_DISK=/dev/sda
# POCKNIX_BOOT_GPT_NAME=POCKNIX
# POCKNIX_BOOT_FAT_LABEL=POCKNIX
# POCKNIX_ROOT_LABEL=POCKNIX_ROOT
