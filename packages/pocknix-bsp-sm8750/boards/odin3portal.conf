# /usr/lib/pocknix/boards/odin3portal.conf — runtime board facts: AYN Odin 3 Portal.
# Selected by /usr/lib/pocknix/device.conf (DT model "AYN Odin 3 Portal").
POCKNIX_DEVICE=odin3portal
POCKNIX_SOC=sm8750

# Panel: vtdr6130,o3p — native 1080x1920 portrait (mismas modas 60/120 Hz que
# publica el parche 2160), DTS rotation=270 -> landscape.
# POCKNIX_PANEL_W/H carry the NATIVE portrait geometry; pocknix-steam
# transposes them to the logical landscape -W/-H for a 90/270 orientation.
# Get this transpose right or the panel renders wrong/black.
# TODO(hardware): confirmar en la unidad que rotation=270 es la buena y que el
# refresco por defecto de 120 Hz es estable (el parche 2161 permite calibrar
# frame_len_120/60 por unidad).
POCKNIX_PANEL_W=1080
POCKNIX_PANEL_H=1920
POCKNIX_PANEL_REFRESH=120
POCKNIX_PANEL_ORIENT=right       # gamescope --force-orientation
POCKNIX_PANEL_MM=177x100         # deliberately fake: same 1920x1080 output as the Odin 3 -> same ~275dpi UI
POCKNIX_DESKTOP_ROTATE=right     # kscreen-doctor rotation token (Rotate270)
POCKNIX_DESKTOP_SCALE=2.5

# Rotation at scanout (pocknix-steam --rotated-output-max-height). The SM8750 DPU's
# inline rotator only accepts a rotated plane whose PRE-rotation source height is within
# this many lines; gamescope clamps the logical output to it (and the plane upscales back
# to the mode for free). The 1080-wide panel is under the cap, so the clamp is a no-op and
# the DPU still rotates in hardware (same as the Odin 3).
POCKNIX_PANEL_ROTATE_MAX_H=1088  # DPU inline rotator pre-rotation source cap (lines)

# CPU topology: big-core mask for emulator pinning (pocknix-play). SM8750:
# all 8 cores are big (no little cluster), so the whole mask is used.
POCKNIX_BIG_CORES=0-7

# TODO(hardware): HDR y brillo. El perfil de gamescope del Odin 3 es especifico de
# la ICNA3520 (overlay/usr/share/gamescope/scripts/10-armada/ayn.icna3520.oled.lua,
# device_id ayn-odin-3) y pocknix-panel-calib aplica el maximo de brillo de la Odin 3.
# La Portal necesitara su propio perfil / GAMESCOPE_INTERNAL_DEVICE_ID y su curva de
# brillo: no se activa nada aqui hasta medirlo en la consola.
#POCKNIX_PANEL_BRIGHTNESS_MAX=...
#POCKNIX_HDR_MAX_NITS=...

# --- install-to-internal contract (qcom-abl) -----------------------------------
# Same labels the ABL expects on the SD boot FAT (see profile.conf SD_FAT_LABEL):
# the Odin 3's boot contract uses ROCKNIX's labels, not POCKNIX's.
POCKNIX_INTERNAL_DISK=/dev/sda
POCKNIX_BOOT_GPT_NAME=ROCKNIX
POCKNIX_BOOT_FAT_LABEL=ROCKNIX
POCKNIX_ROOT_LABEL=POCKNIX_ROOT
