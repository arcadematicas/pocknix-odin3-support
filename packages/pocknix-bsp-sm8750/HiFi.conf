# Use case configuration for AYN SM8750
# Author: Teguh Sobirin <teguh@sobir.in>

SectionVerb {
	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Include.wcde.File "/codecs/wcd939x/DefaultEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	# El altavoz lo mueven dos amplificadores AW88166, con volumen en `SPK_L/R PCM
	# Playback Volume` (0..1023). PipeWire NO los toca (no hay PlaybackMixer para este
	# dispositivo), y se quedaban a 0 tras usar los auriculares -> silencio aunque la
	# ruta fuese la correcta. Se fijan aqui y se liberan los switches de auriculares
	# (que el codec deja encendidos al desenchufar).
	# Ver docs/AUDIO-AURICULARES-20261022.md.
	EnableSequence [
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='CLSH Switch' 0"
		cset "name='SPK_L PCM Playback Volume' 950"
		cset "name='SPK_R PCM Playback Volume' 950"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	# rx-macro routing first, then the PCM mode flags, then the wcd939x
	# bring-up: the HPH and COMP switches connect their SoundWire ports
	# when set, so the mode has to be in place before they come up.
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"

	EnableSequence [
		cset "name='HPH PCM Switch' 1"
		cset "name='RX_HPH PCM Switch' 1"
	]

	Include.wcdhpe.File "/codecs/wcd939x/HeadphoneEnableSeq.conf"

	# La compander (HPHL/HPHR_COMP) mete bombeo y, con la impedancia sin declarar
	# (HPHL/HPHR Impedance = 0), entrecortados con auriculares de estudio. Se apaga
	# DESPUES del include de arriba, que es quien la enciende.
	# Medido: con la compander activa, el PCM de auriculares entraba en xrun y se oia
	# entrecortado; apagandola, perfecto. Ver docs/AUDIO-AURICULARES-20261022.md.
	EnableSequence [
		cset "name='HPHL_COMP Switch' 0"
		cset "name='HPHR_COMP Switch' 0"
	]

	Include.wcdhpd.File "/codecs/wcd939x/HeadphoneDisableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	DisableSequence [
		cset "name='HPH PCM Switch' 0"
		cset "name='RX_HPH PCM Switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP Digital"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}
