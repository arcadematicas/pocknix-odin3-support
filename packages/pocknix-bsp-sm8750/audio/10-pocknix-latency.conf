# Pocknix: suelo de latencia para el audio del SM8750 (WCD939x por SoundWire).
#
# POR QUE: el PCM de auriculares (hw:SM8750AYN,1p) entraba en xrun
#   spa.alsa: hw:SM8750AYN,1p: snd_pcm_avail after recover: Broken pipe
# cuando una aplicacion pedia buffers muy pequenos (el minimo del driver es
# period_time 10 ms, y con 2 periodos el margen es minimo). Con este suelo,
# ninguna app puede pedir menos de 512 frames (~10,7 ms) y el caso desaparece.
#
# Coste: ~10 ms de latencia adicional en el peor caso; inapreciable en juegos y
# musica, y evita los chasquidos.
context.properties = {
    default.clock.quantum      = 1024
    default.clock.min-quantum  = 512
    default.clock.max-quantum  = 2048
}
