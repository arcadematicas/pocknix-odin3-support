# Use case configuration for AYN SM8750 - perfil AURICULARES
# Perfil separado del de altavoz a proposito: al ser VERBOS distintos, PipeWire conmuta
# PERFIL (no puerto) al enchufar/sacar, y eso vuelve a ejecutar la EnableSequence del UCM.
# Es lo que evita el zumbido que solo se curaba reabriendo el PCM.
# Ver docs/PENDIENTES.md y docs/AUDIO-ARMADA-ANALISIS.md (UCM por perfiles).

SectionVerb {
	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Include.wcde.File "/codecs/wcd939x/DefaultEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	# rx-macro routing first, then the PCM mode flags, then the wcd939x
	# bring-up: the HPH and COMP switches connect their SoundWire ports
	# when set, so the mode has to be in place before they come up.
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"

	EnableSequence [
		cset "name='HPH PCM Switch' 1"
		cset "name='RX_HPH PCM Switch' 1"
	]

	Include.wcdhpe.File "/codecs/wcd939x/HeadphoneEnableSeq.conf"

	# Auriculares en class-H (LOHIFI) con la compander que enciende el propio codec: es el
	# estado medido como bueno en la Odin 3 (HCtrl 0x36, impedancia 63/72 ohm, -3 dB de PA).

	Include.wcdhpd.File "/codecs/wcd939x/HeadphoneDisableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	DisableSequence [
		cset "name='HPH PCM Switch' 0"
		cset "name='RX_HPH PCM Switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP Digital"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"

	Include.wcdmice.File "/codecs/wcd939x/HeadphoneMicEnableSeq.conf"

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='TX_DEC0 Volume' 96"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='DEC1 MODE' ADC_DEFAULT"
		cset "name='TX_DEC1 Volume' 96"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]

	Include.wcdmicd.File "/codecs/wcd939x/HeadphoneMicDisableSeq.conf"

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		JackControl "Mic Jack"
		JackHWMute "Mic"
	}
}
