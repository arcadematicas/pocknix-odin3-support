# Drop-in del BSP del Odin 3 para hexagonrpcd-adsp-sensorspd.service.
#
# La unidad (packages/pocknix-bsp-sm8750/hexagonrpcd/hexagonrpcd-adsp-sensorspd.service) ya trae
# ConditionPathExists= del arbol HexagonFS. El problema es el orden: systemd evalua esas
# condiciones al arrancar la unidad y, si fallan, NO la reintenta. Y el arbol lo prepara
# pocknix-sensors-tree.service, que corre despues del loader.
#
#   - Wants: garantiza que el script del arbol se ejecute.
#   - After: garantiza que corra antes que el demonio.
#
# Nota (2026-10-15): hasta hoy esta unidad NO se habilitaba porque el ADSP sensor PD no subia en
# este SoC y generar solo un bucle de reinicios. Ya sube: con pd-mapper registrando "sensor_pd" y
# este arbol servido, el SSC expone acelerometro, giroscopio, magnetometro y rotv.
# Ver docs/SENSORES-ODIN3-2026-10-15.md.
[Unit]
Wants=pocknix-sensors-tree.service
After=pocknix-sensors-tree.service
