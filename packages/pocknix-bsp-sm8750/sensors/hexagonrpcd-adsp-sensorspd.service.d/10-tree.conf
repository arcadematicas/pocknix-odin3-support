# Drop-in del BSP del Odin 3 para hexagonrpcd-adsp-sensorspd.service.
#
# La unidad (packages/pocknix-bsp-sm8750/hexagonrpcd/hexagonrpcd-adsp-sensorspd.service) ya trae
# ConditionPathExists= del arbol HexagonFS. El problema es el orden: systemd evalua esas
# condiciones al arrancar la unidad y, si fallan, NO la reintenta. Y el arbol lo prepara
# pocknix-sensors-tree.service, que corre despues del loader.
#
#   - Wants/After pocknix-sensors-tree: garantiza que el arbol exista antes del demonio.
#   - Wants/After pd-mapper: el ADSP solo acepta INIT_ATTACH_SNS cuando pd-mapper ya le ha
#     registrado el process domain "sensor_pd". Sin esto el demonio arrancaba antes, recibia
#     "Unexpected buffer count for method 31" y salia con codigo 0 (17/10/2026).
#
# Ver docs/SENSORES-ODIN3-2026-10-15.md.
[Unit]
Wants=pocknix-sensors-tree.service pd-mapper.service
After=pocknix-sensors-tree.service pd-mapper.service
