# Drop-in del BSP del Odin 3 para pd-mapper.service (unidad del paquete `pd-mapper`).
#
# pd-mapper lee los ficheros .jsn (registro de servicios servreg) UNA vez, al arrancar, y si no
# los encuentra sale con "no pd maps available". Los busca en el mismo directorio que el
# firmware-name del remoteproc del ADSP:
#     /sys/class/remoteproc/remoteproc0/firmware = qcom/sm8750/adsp.mbn
#  -> $(cat /sys/module/firmware_class/parameters/path)/qcom/sm8750/*.jsn
# y esa ruta la fija msm-firmware-loader a /run/msm-firmware-loader/target.
#
# Es pocknix-sensors-tree.service quien deja alli los .jsn (y el arbol HexagonFS), asi que:
#   - Wants: garantiza que el script se ejecute.
#   - After: garantiza que para cuando arranquemos los .jsn ya esten.
#
# Sin esto, pd-mapper arranca antes de tiempo, no encuentra mapas y el ADSP nunca registra el
# process domain "sensor_pd": el SSC se queda a medias (acelerometro y giroscopio si,
# magnetometro y rotv no). Ver docs/SENSORES-ODIN3-2026-10-15.md.
[Unit]
Wants=pocknix-sensors-tree.service
After=pocknix-sensors-tree.service
