# iio-sensor-proxy tiene un backend SSC (libssc): enumera los sensores UNA vez, al arrancar.
# Si arranca antes de que hexagonrpcd sirva el arbol, se queda sin sensores hasta un restart
# manual (visto en la Odin el 17/10: "Message 130 for sensor ..." pero HasAccelerometer=false
# hasta reiniciar el proxy). Ordenarlo despues del demonio del SSC.
[Unit]
Wants=hexagonrpcd-adsp-sensorspd.service
After=hexagonrpcd-adsp-sensorspd.service
