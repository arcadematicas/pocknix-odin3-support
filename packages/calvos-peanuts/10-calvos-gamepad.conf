# En la Odin 3, inputplumber captura el mando fisico (AYN Odin3 Gamepad, 2020:3001) para
# crear su Xbox 360 virtual (045e:028e); el fisico NO entrega eventos. SDL debe ignorarlo y
# usar el virtual, o Peanuts/RetroArch se quedan con un mando "conectado" que no responde.
SDL_GAMECONTROLLER_IGNORE_DEVICES=0x2020/0x3001
