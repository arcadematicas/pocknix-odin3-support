# AYN Odin 3 Gamepad — autoconfig de RetroArch (driver de joypad "udev")
#
# Dispositivo físico: /dev/input/event6 (js0), nombre "AYN Odin3 Gamepad"
#   vendor 0x2020 = 8224   product 0x3001 = 12289
#   MODALIAS: input:b0003v2020p3001e0001
#   phys: rsinput-gamepad/input0 (driver del kernel drivers/input/joystick/rsinput.c)
#   GUID SDL: 0300bb95202000000130000001000000 (RetroArch no lo usa; apuntado aquí)
#
# ---------------------------------------------------------------------------
# CÓMO ESTÁ NUMERADO EL DRIVER "udev" DE RETROARCH (v1.22.2)
# input/drivers_joypad/udev_joypad.c
#
# BOTONES: asigna índices correlativos a los keycodes que declara el
# dispositivo, recorriendo: KEY_UP..KEY_DOWN (103..108), después
# BTN_MISC..KEY_MAX (0x100..0x2fe), después 0..102 y por último 109..255.
# El AYN declara estos 16 keycodes (MODALIAS):
#   k116,130,131,133,134,136,137,13A,13B,13C,13D,13E,220,221,222,223
# de ahí sale (calculado con el algoritmo exacto del driver):
#    0 = 0x116 BTN_TRIGGER_HAPPY1   (sin uso conocido, se deja sin asignar)
#    1 = 0x130 BTN_SOUTH   -> A  (círculo, botón de abajo en la Odin)
#    2 = 0x131 BTN_EAST    -> B  (cruz)
#    3 = 0x133 BTN_NORTH   -> Y  (triángulo)
#    4 = 0x134 BTN_WEST    -> X  (cuadrado)
#    5 = 0x136 BTN_TL      -> L1
#    6 = 0x137 BTN_TR      -> R1
#    7 = 0x13A BTN_SELECT  -> Select (-)
#    8 = 0x13B BTN_START   -> Start (+)
#    9 = 0x13C BTN_MODE    -> Guide (botón Odin / Home)
#   10 = 0x13D BTN_THUMBL  -> L3 (click stick izquierdo)
#   11 = 0x13E BTN_THUMBR  -> R3 (click stick derecho)
#   12 = 0x220 BTN_DPAD_UP
#   13 = 0x221 BTN_DPAD_DOWN
#   14 = 0x222 BTN_DPAD_LEFT
#   15 = 0x223 BTN_DPAD_RIGHT
# La cruceta son BOTONES (el joystick declara 0 hats), de ahí 12/13/14/15
# y no h0up/h0down/h0left/h0right.
#
# EJES: numera correlativamente los ABS presentes por orden de código, saltando
# los hats. El AYN declara ABS_X..ABS_RZ (capabilities/abs = 3f), medido con
# EVIOCGABS:
#    0 = ABS_X   stick izq. X   (min=-256, max=1024)
#    1 = ABS_Y   stick izq. Y   (min=-256, max=1024)
#    2 = ABS_Z   gatillo L2     (min=0, max=1552=0x610, flat=30)
#    3 = ABS_RX  stick der. X   (min=-256, max=1024)
#    4 = ABS_RY  stick der. Y   (min=-256, max=1024)
#    5 = ABS_RZ  gatillo R2     (min=0, max=1552, flat=30)
# ABS_Z/ABS_RZ = gatillos: lo confirma el capability map de InputPlumber de
# ROCKNIX (ayn_mcu.yaml: ABS_Z -> LeftTrigger, ABS_RZ -> RightTrigger).
#
# SIGNO: RetroArch normaliza el valor con
# (value-min)*65535/(max-min)-32767. Los gatillos descansan en 0 con min=0
# (-32767 al soltar, +32767 al pulsar) y el driver les aplica el ajuste
# "neg_trigger" val=(val+0x7fff)/2 -> 0 al soltar, positivo al pulsar, así que
# van con "+".
#
# ---------------------------------------------------------------------------
# OJO: A/B/X/Y es lo único NO verificado con el mando en la mano (no se ha
# podido pulsar botones). Deducido de tres fuentes que coinciden:
#   - keymap del driver rsinput: el MCU manda los botones en el mismo orden de
#     bits que un HID de XInput (bit7=A, bit6=B, bit5=X, bit4=Y) y el driver
#     lo mapea a BTN_SOUTH/EAST/WEST/NORTH, o sea A=BTN_SOUTH(304).
#   - _externos/armada/input/Vendor_2020_Product_3001.kl: BUTTON_A=304,
#     BUTTON_B=305, BUTTON_X=307, BUTTON_Y=308.
#   - _externos/rocknix/.../AYN_Odin2_Gamepad.cfg: a=0, b=1, x=2, y=3.
# Si al probar sale invertido, es cosa de estas 4 líneas; el índice de cada
# botón está en la tabla de arriba.
# ---------------------------------------------------------------------------

input_device_display_name = "AYN Odin3 Gamepad"

